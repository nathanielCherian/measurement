# Rendered by deploy/install.sh. Serves the probe page for @DOMAIN@; the
# WebTransport server itself listens separately on UDP @PORT@ (not via nginx).
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Let's Encrypt renewals (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root @ACME_ROOT@;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @WEB_ROOT@;
    index index.html;

    # WebRTC signaling (rtc.html posts its SDP offer here); the media path is
    # UDP straight to the server, not proxied.
    location /rtc/ {
        proxy_pass http://127.0.0.1:@RTC_PORT@/;
        proxy_set_header Host $host;
    }

    # HTTP packet trains (trains.html, http-post / http-bulk transports) and the
    # RTT page's load generator (/trains/load/{upload,download}).
    location /trains/ {
        proxy_pass http://127.0.0.1:@HTTP_TRAINS_PORT@/trains/;
        proxy_http_version 1.1;
        proxy_request_buffering off;   # let the body stream through as it arrives
        proxy_buffering off;           # and the download stream out as it is written
        client_max_body_size 0;        # the load generator posts tens of MB per request
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    # The probe server uses this domain's CA-signed cert, so the page must not
    # pin a self-signed hash; a 404 here makes main.js connect without one.
    location = /cert-hash.json {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
