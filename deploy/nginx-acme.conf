# Stage 1 (rendered by deploy/install.sh): HTTP only, so certbot can prove
# control of @DOMAIN@ before the HTTPS server block can reference its cert.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    location /.well-known/acme-challenge/ {
        root @ACME_ROOT@;
    }

    location / {
        return 404;
    }
}
